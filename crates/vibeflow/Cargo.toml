[package]
name = "vibeflow"
description = "GPU-accelerated Linux terminal emulator that knows when your AI tool is waiting on you."
categories = ["command-line-utilities"]
keywords = ["terminal", "ai", "gpu", "wgpu", "vibeflow"]
readme = "README.md"
# Decoupled from the workspace version (which tracks the unchanged
# `vibeflow-protocol`, still 0.1.3): the app iterates ahead of the protocol.
# `-dev` marks an unreleased build; dropped to `0.1.4` at the release-finale.
version = "0.1.4-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vibeflow"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.24"
anyhow = "1"
arboard = "3.6"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.12"
dirs = "5"
notify = "6"
plist = "1"
png = "0.17"
pollster = "0.3"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
vibeflow-protocol = { path = "../vibeflow-protocol", version = "0.1" }
wgpu = "0.20"
winit = "0.30"

[dev-dependencies]
alacritty_terminal = "0.24"
proptest = "1"
tempfile = "3"
