name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Opt runner-bundled JS actions (checkout, setup-node, rust-cache,
  # rust-toolchain) into Node 24 ahead of GitHub's June 2026 forced upgrade.
  # Silences the per-job "Node.js 20 actions are deprecated" warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  fuzz:
    name: Fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/vibeflow-protocol/fuzz"

      - name: Install cargo-fuzz
        # NOT --locked: cargo-fuzz 0.13.x's bundled Cargo.lock pins
        # rustix 0.36.5 (Dec 2022), which uses #[cfg_attr(rustc_attrs, …)]
        # attributes that newer nightly rustc rejects. Letting the resolver
        # pick a current rustix lets the install succeed.
        run: cargo install cargo-fuzz

      - name: Run parse fuzzer for 60s
        working-directory: crates/vibeflow-protocol
        run: cargo +nightly fuzz run parse -- -max_total_time=60

  npm:
    name: npm (@vibeflow/protocol)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/npm
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 (current LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bindings/npm/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
