name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Opt runner-bundled JS actions (checkout, setup-node, rust-cache,
  # rust-toolchain) into Node 24 ahead of GitHub's June 2026 forced upgrade.
  # Silences the per-job "Node.js 20 actions are deprecated" warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-05-24
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  fuzz:
    name: Fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly as of 2026-05-24

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: "crates/vibeflow-protocol/fuzz"

      - name: Install cargo-fuzz
        # NOT --locked: cargo-fuzz 0.13.x's bundled Cargo.lock pins
        # rustix 0.36.5 (Dec 2022), which uses #[cfg_attr(rustc_attrs, …)]
        # attributes that newer nightly rustc rejects. Letting the resolver
        # pick a current rustix lets the install succeed.
        run: cargo install cargo-fuzz

      - name: Run parse fuzzer for 60s
        working-directory: crates/vibeflow-protocol
        run: cargo +nightly fuzz run parse -- -max_total_time=60

  npm:
    name: npm (vibeflow-protocol)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Use Node.js 22 (current LTS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bindings/npm/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  packaging:
    name: Packaging assertions (Cargo + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-05-24

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1

      - name: Use Node.js 22 (current LTS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bindings/npm/package-lock.json

      - name: Verify Cargo packages include LICENSE-MIT, LICENSE-APACHE, README.md
        run: |
          set -euxo pipefail
          for crate in vibeflow-protocol vibeflow; do
            for required in LICENSE-MIT LICENSE-APACHE README.md; do
              cargo package --list -p "$crate" --allow-dirty \
                | grep -qE "(^|/)${required}$" \
                || { echo "::error::missing $required in cargo package -p $crate"; exit 1; }
            done
          done

      - name: Verify Cargo workspace version matches npm package.json version
        run: |
          set -euxo pipefail
          # NOTE: --offline removed per senior pre-exec review. On a cold
          # Swatinem cache (first CI run for a branch) the registry index
          # isn't fetched yet, so --offline would fail. cargo metadata
          # without --offline does no real network traffic for --no-deps.
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 2>/dev/null \
            | python3 -c "import json,sys; m=json.load(sys.stdin); \
                          p=[x for x in m['packages'] if x['name']=='vibeflow-protocol'][0]; \
                          print(p['version'])")
          NPM_VER=$(python3 -c "import json; print(json.load(open('bindings/npm/package.json'))['version'])")
          if [ "$CARGO_VER" != "$NPM_VER" ]; then
            echo "::error::Cargo vibeflow-protocol version ($CARGO_VER) != npm package.json version ($NPM_VER)"
            exit 1
          fi
          echo "Versions match: $CARGO_VER"

      - name: Verify cargo publish --dry-run for both crates
        run: |
          set -euxo pipefail
          # vibeflow-protocol: standalone dry-run. Must succeed.
          # --allow-dirty matches the cargo package --list step above; the
          # checkout is clean on CI but cargo's symlink-dirty detection has
          # historically been quirky, so we explicitly opt out for parity.
          cargo publish --dry-run --allow-dirty -p vibeflow-protocol
          # vibeflow: depends on vibeflow-protocol being on the registry,
          # which it is (v0.1.0 shipped). Must also succeed end-to-end.
          cargo publish --dry-run --allow-dirty -p vibeflow

      - name: Verify npm pack from a CLEAN checkout (no pre-built dist)
        working-directory: bindings/npm
        run: |
          set -euxo pipefail
          # Ensure dist/ does not exist; the prepack script should create it.
          rm -rf dist
          npm ci
          # `npm pack --dry-run --json` lists exactly what would be published.
          # Capture stdout separately so npm notices on stderr don't break JSON parse.
          npm pack --dry-run --json 2>/dev/null > /tmp/pack.json
          files=$(python3 -c "
          import json
          out = json.load(open('/tmp/pack.json'))
          print('\n'.join(f['path'] for f in out[0]['files']))")
          echo "$files"
          for required in dist/src/index.js dist/src/index.d.ts LICENSE-MIT LICENSE-APACHE README.md package.json; do
            echo "$files" | grep -qE "^$required$" \
              || { echo "::error::missing $required in npm pack"; exit 1; }
          done
